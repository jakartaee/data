# This workflow automates the deployment of signature files
# Run on_push when any API is updated
# Or manually using workflow_dispatch

name: Update signature files

on:
  push:
    branches:
      - 'main'
      - 'RELEASE-*'
    paths:
      - 'api/src/**'
      - 'stateful/src/**'
  workflow_dispatch: # For manual testing

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout source
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Set up JDK 21
      uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven
    - name: Build project
      run: mvn install -DskipTests -Dmaven.javadoc.skip=true -projects ".,api,stateful"
    - name: Cache local Maven repository
      uses: actions/cache/save@v4
      with:
        path: ~/.m2/repository
        key: maven-${{ github.sha }}

  update:
    needs: [build]
    runs-on: ubuntu-latest

    strategy:
      max-parallel: 1
      matrix:
        java-version: [ '17', '21', '25' ]

    steps:
    - name: Checkout source
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Restore local Maven repository
      uses: actions/cache/restore@v4
      with:
        path: ~/.m2/repository
        key: maven-${{ github.sha }}
    - name: Set up JDK ${{ matrix.java-version }}
      uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
      with:
        java-version: ${{ matrix.java-version }}
        distribution: 'temurin'
        cache: maven
    - name: Checkout branch
      id: checkout
      run: .github/scripts/checkout.sh update-generated-files-${{ github.sha }}
    - name: Generate signatures
      run: mvn package -DskipTests -Psignature-generation --file tck/pom.xml
    - name: Needs updates
      id: update
      run: echo "update_count=$(git status -s | wc -l)" >> $GITHUB_OUTPUT
    - name: Create commit
      if: steps.update.outputs.update_count > 0
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git config user.name "github-actions[bot]"

        git add tck/src/main/resources/
        git commit -m "Update generated files ${{ matrix.java-version }}"
        git push origin update-generated-files-${{ github.sha }}

  pull-request:
    needs: [update]
    uses: ./.github/workflows/pull-request.yml
    with:
      branch: 'update-generated-files-${{ github.sha }}'
      title: 'Update generated files'
      body: 'generated pull request'
